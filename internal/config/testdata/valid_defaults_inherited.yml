global:
  check_interval: 15s
  failure_threshold: 4
  ssh_timeout: 5s

services:
  - name: web-api-1
    check_type: http
    target: "http://10.0.0.5:8080/health"
    # check_interval and failure_threshold are intentionally omitted:
    # they should be inherited from the global values.

    ssh:
      host: "10.0.0.5"
      port: 22
      user: "deploy"
      key_path: "/home/deploy/.ssh/phoenix_id_ed25519"

    recover:
      strategy: docker_restart
      target: "web-api-container"
