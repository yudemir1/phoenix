global:
  check_interval: 10s
  failure_threshold: 3
  ssh_timeout: 5s

services:
  - name: db-proxy
    check_type: tcp
    target: "10.0.0.12:5432"

    ssh:
      host: "10.0.0.12"
      port: 22
      user: "deploy"
      key_path: "/home/deploy/.ssh/phoenix_id_ed25519"

    recover:
      strategy: custom_command
      target: "db-proxy"
      # command is intentionally missing
