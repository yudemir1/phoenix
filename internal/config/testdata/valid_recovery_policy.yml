global:
  check_interval: 10s
  failure_threshold: 3
  ssh_timeout: 5s
  timeout: 3s
  # Deliberately different from the built-in defaults (5m / 3 / 30m) so the
  # test can tell "the file was read" apart from "the default was applied".
  recovery_cooldown: 10m
  recovery_max_attempts: 7
  recovery_attempt_window: 2h

services:
  - name: web-api-1
    check_type: http
    target: "http://10.0.0.5:8080/health"

    ssh:
      host: "10.0.0.5"
      port: 22
      user: "deploy"
      key_path: "/home/deploy/.ssh/phoenix_id_ed25519"

    recover:
      strategy: docker_restart
      target: "web-api-container"
